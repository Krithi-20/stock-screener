<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Strykr</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="icon"
        type="image/png"
        href="/images/strike.png"
    >

</head>


<body>

<div class="container">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div class="header">


        <!-- =================================================
             TITLE
             ================================================= -->

        <div class="title-section">

            <h1>
                Strykr
            </h1>

            <p>

                NSE/BSE Listed Stock Screener

                <span
                    class="status"
                    id="status">
                </span>

            </p>

        </div>


        <!-- =================================================
             RIGHT SIDE
             ================================================= -->

        <div class="header-right">




            <!-- =============================================
                 MARKET CAP
                 ============================================= -->

            <div class="market-cap-filter">

                <label for="marketCapSelect">
                    Market Cap
                </label>

                <select id="marketCapSelect">

                    <option value="1000">
                        ₹1,000 Cr+
                    </option>

                    <option value="2000">
                        ₹2,000 Cr+
                    </option>

                    <option value="3000">
                        ₹3,000 Cr+
                    </option>

                    <option value="4000">
                        ₹4,000 Cr+
                    </option>

                    <option value="5000">
                        ₹5,000 Cr+
                    </option>

                </select>

            </div>

        </div>

    </div>


    <!-- =====================================================
         TABS
         ===================================================== -->

    <div class="tabs">

        <button
            class="tab active"
            id="allTab"
            onclick="showAll()">

            All Companies

        </button>


        <button
            class="tab"
            id="performersTab"
            onclick="showPerformers()">

            Top Performers

        </button>


        <button
            class="tab"
            id="losersTab"
            onclick="showLosers()">

            Top Losers

        </button>

    </div>


    <!-- =====================================================
         TABLE
         ===================================================== -->

    <div class="table-container">

        <table>

            <thead>

            <tr>

                <th>
                    Rank
                </th>

                <th>
                    NSE Symbol
                </th>

                <th>
                    Company
                </th>

                <th>
                    Change %
                </th>

                <th>
                    Market Cap
                </th>

                <th>
                    Live Price
                </th>

                <th>
                    Change
                </th>

                <th>
                    Group
                </th>

            </tr>

            </thead>


            <tbody id="companyTable">

            <tr>

                <td
                    colspan="8"
                    class="loading">

                    Loading companies...

                </td>

            </tr>

            </tbody>

        </table>

    </div>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <div class="footer">

        <div id="total">
            Companies: -
        </div>

        <div id="lastUpdated">
            Last update: -
        </div>

    </div>

</div>


<script
    type="module"
    src="/js/app.js">
</script>


</body>

</html>
